spring.application.name=GrandReserve-Api
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/core
spring.datasource.username=root
spring.datasource.password=786313
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.url=jdbc:mysql://localhost:3306/core
spring.flyway.user=root
spring.flyway.password=786313
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing Core Schema

# Flyway Logging
logging.level.org.flywaydb=INFO