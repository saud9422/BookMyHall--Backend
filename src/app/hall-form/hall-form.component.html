<div class="add-hall-page">

  <div class="container">

    <div class="row justify-content-center">

      <div class="col-12 col-md-10 col-lg-8">

        <!-- Main form box -->
        <div class="hall-form-card">

          <!-- Form heading -->
          <div class="text-center mb-4">
            <h2 class="hall-title">Add New Hall</h2>

            <p class="hall-subtitle">
              Add the details of your hall below
            </p>
          </div>


          <form>


            <div class="mb-3">
              <label class="form-label">
                Hall Name
              </label>

              <input type="text" class="form-control" placeholder="Enter hall name" />
            </div>


            <!-- Description -->
            <div class="mb-3">
              <label class="form-label">
                Description
              </label>

              <textarea class="form-control" rows="4" placeholder="Enter hall description"></textarea>
            </div>


            <div class="mb-3">
              <label class="form-label">
                Location
              </label>

              <input type="text" class="form-control" placeholder="Enter hall location" />
            </div>



            <div class="row">


              <div class="col-md-6 mb-3">

                <label class="form-label">
                  Price Per Hour
                </label>

                <div class="input-group">

                  <span class="input-group-text">
                    ₹
                  </span>

                  <input type="number" class="form-control" placeholder="Enter price" />

                </div>

              </div>



              <div class="col-md-6 mb-3">

                <label class="form-label">
                  Price Per Day
                </label>

                <div class="input-group">

                  <span class="input-group-text">
                    ₹
                  </span>

                  <input type="number" class="form-control" placeholder="Enter price" />

                </div>

              </div>

            </div>



            <div class="row">


              <div class="col-md-6 mb-3">

                <label class="form-label">
                  Capacity
                </label>

                <input type="number" class="form-control" placeholder="Number of people" />

              </div>


              <!-- Hall Type -->
              <div class="col-md-6 mb-3">

                <label class="form-label">
                  Hall Type
                </label>

                <select class="form-select">

                  <option selected disabled>
                    Select hall type
                  </option>

                  <option>
                    MARRIEGE
                  </option>

                  <option>
                    RECEPTION
                  </option>

                  <option>
                    EVENT 
                  </option>

                  <option>
                    BIRTHDAY
                  </option>

                   <option>
                    GATHERING
                  </option>

                   <option>
                    OTHERS
                  </option>


                </select>

              </div>

            </div>


            <!-- Image URL -->
            <div class="mb-4">

             <label class="form-label">Upload Images</label>
             <input class="form-control" type="file" accept="image/*" (change)="selectImage($event)">

            </div>


            <div class="hall-buttons">

              <button type="button" class="btn btn-cancel">
                Cancel
              </button>

              <button type="submit" class="btn btn-add-hall" (click)="Savehall()">
                Add Hall
              </button>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>

</div>
```
