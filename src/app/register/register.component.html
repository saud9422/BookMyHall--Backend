<section class="register-page">
  <div class="container">
    <div class="register-card">
      <div class="row">

        <div class="col-lg-6">
          <div class="register-form">

            <h2>Sign Up</h2>

            <form>
              <div class="mb-3">
                <label for="name">Your Name</label>
                <input type="text" id="name" class="form-control"
                  placeholder="Enter your name"  name="name" [(ngModel)]="user.name">
              </div>

              <div class="mb-3">
                <label for="email">Your Email</label>
                <input type="email" id="email" class="form-control"
                  placeholder="Enter your email" name="email" [(ngModel)]="user.email">
              </div>

              <div class="mb-3">
                <label for="phone">Your Phone</label>
                <input type="tel" id="phone" class="form-control"
                  placeholder="Enter your phone number" name="phone" [(ngModel)]="user.phone">
              </div>

              <div class="mb-3">
                <label for="address">Address</label>
                <input type="text" id="address" class="form-control"
                  placeholder="Enter your address" name="address" [(ngModel)]="user.address">
              </div>

              <div class="mb-3">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control"
                  placeholder="Enter your password" name="password" [(ngModel)]="user.password">
              </div>

              <div class="mb-3">
                <label for="gender">Gender</label>
                <select id="gender" class="form-select" name="gender" [(ngModel)]="user.gender">
                  <option value="" selected disabled>Select Gender</option>
                  <option value="MALE">Male</option>
                  <option value="FEMALE">Female</option>
                  <option value="OTHERS">Other</option>
                </select>
              </div>

              <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" id="terms">
                <label for="terms" class="form-check-label">
                  I agree to the
                  <a href="#">Terms of service</a>
                </label>
              </div>

              <button type="submit" class="btn register-btn w-100" (click)="register()">
                Register
              </button>

              <div class="text-center mt-3">
                <a href="login" class="login-link">
                  Have an account? Login
                </a>
              </div>
            </form>

          </div>
        </div>

        <div class="col-lg-6 image-box">
          <img
            src="../../assets/images/ChatGPT Image Aug 16, 2026, 07_44_42 PM.png"
            alt="Register"
            class="register-image">
        </div>

      </div>
    </div>
  </div>
</section>
