<section class="hero-section">

  <div class="container">

    <div class="row align-items-center g-5">

      <!-- LEFT CONTENT -->
      <div class="col-lg-6">

        <div class="hero-content reveal">

          <span class="hero-small-title">
            YOUR PERFECT VENUE AWAITS
          </span>

          <h1>
            Find Your Perfect
            <span>Hall For Your Event</span>
          </h1>

          <p class="hero-description">
            Discover beautiful halls and lawns for weddings,
            parties, meetings and every special occasion.
            Find your perfect venue and book it with ease.
          </p>

          <!-- Search Box -->
          <div class="search-box">

            <!-- Location -->
            <div class="search-field">

              <label>
                Location
              </label>

              <select class="form-select">
                <option selected>Amravati</option>
                <option>Nagpur</option>
                <option>Pune</option>
                <option>Mumbai</option>
              </select>

            </div>

            <!-- Date -->
            <div class="search-field">

              <label>
                Event Date
              </label>

              <input type="date" class="form-control" />

            </div>

            <!-- Guests -->
            <div class="search-field">

              <label>
                Guests
              </label>

              <select class="form-select">

                <option selected>100 Guests</option>
                <option>200 Guests</option>
                <option>300 Guests</option>
                <option>500+ Guests</option>

              </select>

            </div>

            <!-- Search Button -->
            <button class="search-btn">
              Search
            </button>

          </div>

        </div>

      </div>


      <!-- RIGHT IMAGE GRID -->
      <div class="col-lg-6">

        <div class="venue-image-grid reveal-reverse">

          <div class="venue-image image-1">
            <img src="../../assets/images/1 (1).jpg" alt="Wedding Hall" />
          </div>

          <div class="venue-image image-2">
            <img src="../../assets/images/1 (2).jpg" alt="Banquet Hall" />
          </div>

          <div class="venue-image image-3">
            <img src="../../assets/images/1 (3).jpg" alt="Wedding Venue" />
          </div>

          <div class="venue-image image-4">
            <img src="../../assets/images/1 (4).jpg" alt="Event Hall" />
          </div>

          <div class="venue-image image-5">
            <img src="../../assets/images/1 (5).jpg" alt="Banquet Venue" />
          </div>

          <div class="venue-image image-6">
            <img src="../../assets/images/1 (6).jpg" alt="Party Hall" />
          </div>

          <div class="venue-image image-7">
            <img src="../../assets/images/1 (7).jpg" alt="Outdoor Lawn" />
          </div>

          <div class="venue-image image-8">
            <img src="../../assets/images/1 (8).jpg" alt="Wedding Lawn" />
          </div>

          <div class="venue-image image-9">
            <img src="../../assets/images/1.jpg" alt="Event Venue" />
          </div>

        </div>

      </div>

    </div>

  </div>

</section>
